<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Embed Studio</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c101b;color:#f4f6fc;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(860px,100%)}h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}p{color:#aab4c9;margin:0 0 24px}.controls{display:flex;gap:10px;margin-bottom:18px}input{flex:1;min-width:0;background:#1c2536;border:1px solid #3b4861;border-radius:10px;padding:14px;color:white;font:inherit}button{background:#ff3355;color:white;border:0;border-radius:10px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#ff526e}.player{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#182032;display:grid;place-items:center;border:1px solid #303d54}.player iframe{width:100%;height:100%;border:0}.hint{font-size:13px;margin-top:14px;color:#aab4c9}#status{color:#ff9fb0;min-height:22px;margin-top:8px}@media(max-width:550px){.controls{flex-direction:column}}
</style>
</head>
<body>
<main class="app">
<h1>▶ YouTube Embed Studio</h1>
<p>Paste a YouTube link to watch it in an embedded player.</p>
<form class="controls" id="videoForm">
<input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube video URL" required>
<button type="submit">Load video</button>
</form>
<div class="player" id="player"><span>Video player will appear here</span></div>
<div id="status" role="status"></div>
<div class="hint">Runs locally on your PC. Videos load from YouTube and require an internet connection. Some videos do not allow embedding.</div>
</main>
<script>
function videoId(value){
 try{const u=new URL(value.trim());const host=u.hostname.toLowerCase();let id=null;
 if(host==='youtu.be'||host==='www.youtu.be')id=u.pathname.split('/')[1];
 else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)){
 if(u.pathname==='/watch')id=u.searchParams.get('v');
 else if(/^\/(embed|shorts|live)\//.test(u.pathname))id=u.pathname.split('/')[2];
 }
 return /^[A-Za-z0-9_-]{11}$/.test(id||'')?id:null;
 }catch{return null;}
}
document.getElementById('videoForm').addEventListener('submit',e=>{
 e.preventDefault();const id=videoId(document.getElementById('url').value);const status=document.getElementById('status');
 if(!id){status.textContent='Please enter a valid YouTube video link.';return;}
 status.textContent='';const iframe=document.createElement('iframe');iframe.title='YouTube video player';iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id);iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.allowFullscreen=true;
 document.getElementById('player').replaceChildren(iframe);
});
</script>
</body>
</html>
